# Production stack for one droplet, run from images built elsewhere and either
# pushed to a registry or copied over SSH. Nothing here publishes ports to the
# internet: the shared edge proxy (~/projects/edge-proxy) terminates HTTPS for
# dd.lazys.net and forwards to the "web" service over the "edge" network.
#
# deploy/deploy.sh builds the images, ships them, copies this file to
# /opt/dd/docker-compose.yml on the droplet and starts it there, with
# BACKEND_IMAGE and WEB_IMAGE set in /opt/dd/.env.
# See README.md, "Production deployment".

services:
  db:
    image: postgres:17
    restart: unless-stopped
    # Sized for a 1 GB droplet shared with other apps: a small buffer cache and
    # few connections (the backend's pool is the only client).
    command: postgres -c shared_buffers=64MB -c max_connections=20
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE (deploy/deploy.sh sets it)}
    restart: unless-stopped
    environment:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: db
      # Optional contact address sent with OpenStreetMap (Nominatim) lookups.
      GEOCODER_CONTACT_EMAIL: ${GEOCODER_CONTACT_EMAIL:-}
      # Google sign-in tokens must be issued for this client id.
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=50}
    # The JVM sizes its heap from this limit (MaxRAMPercentage=50 -> ~192 MB).
    # Without it the JVM would size itself from the whole droplet's memory.
    mem_limit: 384m
    volumes:
      # The key pair that signs login tokens; generated on first start.
      - jwt-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE (deploy/deploy.sh sets it)}
    restart: unless-stopped
    # Plain HTTP only. Published on the droplet's loopback for debugging
    # (curl http://127.0.0.1:8081/ on the droplet); the public way in is the
    # edge proxy.
    ports:
      - "127.0.0.1:${WEB_DEBUG_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      internal:
      edge:
        aliases:
          - dd-web

volumes:
  db-data:
  jwt-keys:

networks:
  internal:
  edge:
    external: true
