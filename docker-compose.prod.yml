# Production stack: a packaged backend, the frontend built to static files,
# and Caddy in front serving HTTPS. Only ports 80 and 443 are published; the
# database and the backend are reachable only from inside this stack.
#
#   cp .env.production.example .env.production      # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See README.md, "Production deployment".

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: db
      # Optional contact address sent with OpenStreetMap (Nominatim) lookups.
      GEOCODER_CONTACT_EMAIL: ${GEOCODER_CONTACT_EMAIL:-}
    volumes:
      # The key pair that signs login tokens; generated on first start.
      - jwt-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates and their private keys - keep these across restarts or
      # Caddy has to ask Let's Encrypt for new ones every time.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    networks:
      - internal

volumes:
  db-data:
  jwt-keys:
  caddy-data:
  caddy-config:

networks:
  internal:
