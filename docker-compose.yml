services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - dd-postgres-data:/var/lib/postgresql/data
#      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - dd
    ports:
      - "5432:5432" 

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks:
      - dd

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
#      - dd-vite-node-modules:/app/node_modules 
    user: "${UID:-1000}:${GID:-1000}"  
    container_name: dd-vite
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - dd

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
#    image: summers/dd-api:1.0.0
    user: "${UID:-1000}:${GID:-1000}"  
    environment:
      HOME: /home/ubuntu
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      QUARKUS_HTTP_HOST: 0.0.0.0
    command: ["./mvnw", "quarkus:dev"]
    volumes:
      - ./backend:/app
      - ~/.m2:/home/ubuntu/.m2
    ports:
      - "9090:8080"
    depends_on:
      - db
    networks:
      - dd

volumes:
  dd-postgres-data:
  dd-vite-node-modules:

networks:
  dd:
