quarkus.container-image.build=true
quarkus.container-image.name=api
quarkus.container-image.tag=1.0.0-SNAPSHOT
quarkus.container-image.group=dd

quarkus.datasource.db-kind=postgresql
# Only bind the explicit URL/credentials for prod and dev; under %test profile
# we leave these unset so DevServices provisions a throwaway Postgres.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}
%dev.quarkus.datasource.username=${DATABASE_USER}
%dev.quarkus.datasource.password=${DATABASE_PASSWORD}

quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.packages=dd
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.analytics.disabled=true

quarkus.live-reload.instrumentation=true

smallrye.jwt.sign.key-store-location=classpath:jwt-keystore.p12
smallrye.jwt.sign.key-store-password=changeit
smallrye.jwt.sign.key-store-type=PKCS12
#smallrye.jwt.new-token.signature-algorithm=RS256
smallrye.jwt.sign.key-id=jwt-signing-key
smallrye.jwt.new-token.issuer=dd-api

smallrye.jwt.verify.key-store-location=classpath:jwt-keystore.p12
smallrye.jwt.verify.key-algorithm=RS256
smallrye.jwt.verify.key-id=jwt-signing-key
smallrye.jwt.verify.key-store-password=changeit
smallrye.jwt.verify.key-store-type=PKCS12

quarkus.smallrye-jwt.enabled=true

# OpenStreetMap Nominatim geocoder (dd.geo.NominatimGeocoder). The public
# instance requires an identifying User-Agent and at most 1 request/second;
# set GEOCODER_CONTACT_EMAIL so its operators can reach you about usage.
dd.geocoder.base-url=${GEOCODER_BASE_URL:https://nominatim.openstreetmap.org}
dd.geocoder.user-agent=${GEOCODER_USER_AGENT:DisasterDistricts/1.0 (ward membership manager)}
dd.geocoder.contact-email=${GEOCODER_CONTACT_EMAIL:}
dd.geocoder.min-interval-ms=1100
