# Use Quarkus DevServices to spin up a throwaway Postgres for tests.
# DevServices will auto-inject the JDBC URL, username, and password — leaving
# them unset here lets it take over instead of falling back to the values
# inherited from src/main/resources/application.properties.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true

# Flyway builds the (empty) schema; dd.SampleDataLoader then loads
# db/sample_data.sql, which the tests are written against.
quarkus.flyway.migrate-at-start=true
